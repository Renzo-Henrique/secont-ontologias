<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 282 1063 424" width="1063" height="424">
<style>
/* Everything that is text, before anything specialises it. The label layer sits
   above the boxes and outside every other group, so a rule that reached labels
   through their edge stopped reaching them the day they were lifted out of it --
   and an SVG with no font-family on a text element falls back to a 16px serif.
   Stated once at the top, no layer can lose it again. */
text {
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-stretch: normal;
    font-size: 11px;
    fill: #1f1c17;
    font-variant-numeric: tabular-nums;
}

.tv-node rect { stroke: #4a453c; stroke-width: 1; }
.tv-node text { fill: #1f1c17; }
.tv-name { font-weight: 600; font-size: 13px; letter-spacing: 0.005em; }
.tv-legend text { font-size: 13px; fill: #1f1c17; }
.tv-stereotype { font-size: 11px; fill-opacity: 0.72; letter-spacing: 0.01em; }
.tv-attribute { font-size: 12px; }
.tv-edge path { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-end { fill: #6e6658; }
/* No letter-spacing on a label drawn with a halo: WebKit places letter-spaced
   SVG text glyph by glyph and then draws no halo, so in Safari, and in an
   exported SVG opened in Preview, the line ran through the label and its
   letters came out uneven. Chromium and Firefox never showed it. */
.tv-edge-stereotype { font-size: 9.5px; fill-opacity: 0.78; }
.tv-marker { fill: #ffffff; stroke: #4a453c; stroke-width: 1.2; }
.tv-arrow { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-reading { fill: #1f1c17; stroke: none; }
.tv-lock { fill: none; stroke: #6e6658; stroke-width: 1.1; stroke-linecap: round; }
.tv-lock rect { fill: #f7f6f2; }
.tv-group rect { fill: none; stroke: #6e6658; stroke-dasharray: 4 3; }
.tv-group text { font-size: 11px; fill: #6e6658; }
.tv-ontology rect { fill: none; stroke: #4a453c; stroke-width: 1.2; stroke-dasharray: none; }
.tv-ontology text { font-weight: 600; font-size: 13px; fill: #1f1c17; }
.tv-location { font-size: 12px; fill-opacity: 0.72; }
.tv-selected rect { stroke: #1f5c5c; stroke-width: 2.5; }
/* The second selector is for a leg of a shared tree, which carries its own id
   and so is chosen as itself rather than through a group around it. */
.tv-selected path, path.tv-selected { stroke: #1f5c5c; stroke-width: 2.2; }
.tv-unresolved rect { stroke-dasharray: 5 3; }
.tv-external rect { stroke-dasharray: 2 2; }
</style>
<rect x="30" y="282" width="1063" height="424" fill="#f7f6f2"/>
<g class="tv-group" data-group="pkg:base-despesas"><rect x="46" y="298" width="1031" height="392" rx="4"/><text x="54" y="312">base-despesas</text></g><g class="tv-edge" data-edge="gen:base-despesas::DespesaOrcamentariaRegistrada-&gt;base-despesas::DespesaOrcamentaria"><path d="M 592 630 L 592 530"/><polygon class="tv-marker" points="592,530 584,544 600,544"/></g><g class="tv-edge" data-edge="rel:base-despesas::ClassificadorInstitucionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica"><path d="M 854 410 L 647 488"/></g><g class="tv-edge" data-edge="rel:base-despesas::ClassificadorFuncionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica"><path d="M 297 460 L 515 502"/></g><g class="tv-edge" data-edge="rel:base-despesas::ClassificadorPorEstruturaProgramaticaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica"><path d="M 810 552 L 668 516"/></g><g class="tv-edge" data-edge="rel:base-despesas::ClassificadorPorNaturezaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica"><path d="M 414 552 L 515 516"/></g><g class="tv-edge" data-edge="rel:base-despesas::FonteDaDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica"><path d="M 444 378 L 459 490 L 568 488"/></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentaria"><title>*pt-br* — Despesa orçamentária é toda transação que depende de autorização legislativa, na forma de consignação de dotação orçamentária, para ser efetivada.
Cite MCASP - 11º Edição: Parte I: Seção 4.1</title><rect x="515" y="488" width="153" height="42" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="591.5" y="503" text-anchor="middle">«kind»</text><text class="tv-name" x="591.5" y="520" text-anchor="middle">DespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::ClassificadorInstitucionalDeDespesa"><title>*pt-br* — A classificação institucional reflete a estrutura de alocação dos créditos orçamentários e está estruturada em dois níveis hierárquicos: órgão orçamentário e unidade orçamentária. Constitui unidade orçamentária o agrupamento de serviços subordinados ao mesmo órgão ou repartição a que serão consignadas dotações próprias (art. 14 da Lei nº 4.320/1964).
Cite MCASP - 11º Edição: Parte I: Seção 4.2.1</title><rect x="784" y="368" width="252" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="910" y="383" text-anchor="middle">«category»</text><text class="tv-name" x="910" y="400" text-anchor="middle">ClassificadorInstitucionalDeDespesa</text></g><g class="tv-node" data-node="base-despesas::ClassificadorFuncionalDeDespesa"><title>*pt-br* — A classificação funcional segrega as dotações orçamentárias em funções e subfunções, buscando responder basicamente à indagação &quot;em que área&quot; de ação governamental a despesa será realizada. A atual classificação funcional foi instituída pela Portaria nº 42/1999, do então Ministério do Orçamento e Gestão, divulgada pela Portaria SOF/ME nº 2.520/2022, e é composta de um rol de funções e subfunções prefixadas, que servem como agregador dos gastos públicos por área de ação governamental nas três esferas de Governo. Trata-se de uma classificação independente dos programas e de aplicação comum e obrigatória, no âmbito da União, dos Estados, do Distrito Federal e dos Municípios, o que permite a consolidação nacional dos gastos do setor público.
Cite MCASP - 11º Edição: Parte I: Seção 4.2.2</title><rect x="64" y="432" width="233" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="180.5" y="447" text-anchor="middle">«category»</text><text class="tv-name" x="180.5" y="464" text-anchor="middle">ClassificadorFuncionalDeDespesa</text></g><g class="tv-node" data-node="base-despesas::ClassificadorPorEstruturaProgramaticaDeDespesa"><title>*pt-br* — Toda ação do Governo está estruturada em programas orientados para a realização dos objetivos estratégicos definidos no Plano Plurianual (PPA) para o período de quatro anos. Conforme estabelecido no art. 3º da Portaria SOF/SETO/ME nº 42/1999 (divulgada pela Portaria SOF/ME nº 2.520/2022), a União, os Estados, o Distrito Federal e os Municípios estabelecerão, em atos próprios, suas estruturas de programas, códigos e identificação, respeitados os conceitos e determinações nela contidos. Ou seja, todos os entes devem ter seus trabalhos organizados por programas e ações, mas cada um estabelecerá seus próprios programas e ações de acordo com a referida Portaria
Cite MCASP - 11º Edição: Parte I: Seção 4.2.3
Na União, o subtítulo representa o menor nível de categoria de programação e será detalhado por esfera orçamentária (fiscal, seguridade e investimento), grupo de natureza de despesa, modalidade de aplicação, identificador de resultado primário, identificador de uso e fonte de recursos, sendo o produto e a unidade de medida os mesmos da ação orçamentária.
Cite MCASP - 11º Edição: Parte I: Seção 4.2.3.3</title><rect x="728" y="552" width="331" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="893.5" y="567" text-anchor="middle">«category»</text><text class="tv-name" x="893.5" y="584" text-anchor="middle">ClassificadorPorEstruturaProgramaticaDeDespesa</text></g><g class="tv-node" data-node="base-despesas::ClassificadorPorNaturezaDeDespesa"><title>*pt-br* — A classificação da despesa orçamentária, segundo a sua natureza, compõe-se de: a. Categoria Econômica ; b. Grupo de Natureza da Despesa ; c. Elemento de Despesa.  A natureza da despesa será complementada pela informação gerencial denominada &quot;Modalidade de Aplicação&quot;, a qual tem por finalidade indicar se os recursos são aplicados diretamente por órgãos ou entidades no âmbito da mesma esfera de Governo ou por outro ente da Federação e suas respectivas entidades, e objetiva, precipuamente, possibilitar a eliminação da dupla contagem dos recursos transferidos ou descentralizados.
Cite MCASP - 11º Edição: Parte I: Seção 4.2.4</title><rect x="232" y="552" width="246" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="355" y="567" text-anchor="middle">«category»</text><text class="tv-name" x="355" y="584" text-anchor="middle">ClassificadorPorNaturezaDeDespesa</text></g><g class="tv-node" data-node="base-despesas::FonteDaDespesa"><title>*pt-br* — A classificação por fontes ou destinações de recursos (FR) tem como objetivo agrupar receitas que possuam as mesmas normas de aplicação na despesa. Em regra, as fontes ou destinações de recursos reúnem recursos oriundos de determinados códigos da classificação por natureza da receita orçamentária, conforme regras previamente estabelecidas. Por meio do orçamento público, essas fontes ou destinações são associadas a determinadas despesas de forma a evidenciar os meios para atingir os objetivos públicos.
Cite MCASP - 11º Edição: Parte I: Seção 5.1
Na execução orçamentária da despesa, a FR estará associada, desde o momento do empenho, às contas de controle orçamentário (classe 6 do PCASP), às contas do passivo financeiro (classe 2 com atributo “F”) e às contas de controle da disponibilidade por destinação de recursos (na classe 8)
Cite MCASP - 11º Edição: Parte I: Seção 5.2</title><rect x="360" y="336" width="120" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="420" y="351" text-anchor="middle">«category»</text><text class="tv-name" x="420" y="368" text-anchor="middle">FonteDaDespesa</text></g><g class="tv-node" data-node="base-despesas::UnidadeGestoraNaDespesa"><title>*pt-br* — Unidade gestora responsável pela emissão do documento contábil de despesa.</title><rect x="481" y="426" width="184" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="573" y="441" text-anchor="middle">«role»</text><text class="tv-name" x="573" y="458" text-anchor="middle">UnidadeGestoraNaDespesa</text></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentariaRegistrada"><title>Agrupa os papeis das despesas que são representadas por arquivos no Portal da Transparência.</title><rect x="481" y="630" width="221" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="591.5" y="645" text-anchor="middle">«role»</text><text class="tv-name" x="591.5" y="662" text-anchor="middle">DespesaOrcamentariaRegistrada</text></g><g class="tv-labels"><text data-for="rel:base-despesas::ClassificadorInstitucionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="755" y="453" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">classifica</text><polygon class="tv-reading" points="720.8,449.5 727.8,446.1 727.8,452.9"/><g class="tv-lock" data-for="rel:base-despesas::ClassificadorInstitucionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" transform="translate(839.1, 419.2)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-end" data-for="rel:base-despesas::ClassificadorInstitucionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="672.2" y="464.1" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text data-for="rel:base-despesas::ClassificadorFuncionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="401.5" y="485" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">classifica</text><polygon class="tv-reading" points="435.7,481.5 428.7,484.9 428.7,478.1"/><g class="tv-lock" data-for="rel:base-despesas::ClassificadorFuncionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" transform="translate(299.7, 467.7)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-end" data-for="rel:base-despesas::ClassificadorFuncionalDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="499.7" y="512.8" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text data-for="rel:base-despesas::ClassificadorPorEstruturaProgramaticaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="743.5" y="538" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">classifica</text><polygon class="tv-reading" points="709.3,534.5 716.3,531.1 716.3,537.9"/><g class="tv-lock" data-for="rel:base-despesas::ClassificadorPorEstruturaProgramaticaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" transform="translate(793.2, 527.7)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-end" data-for="rel:base-despesas::ClassificadorPorEstruturaProgramaticaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="683.9" y="506.1" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text data-for="rel:base-despesas::ClassificadorPorNaturezaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="460" y="538" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">classifica</text><polygon class="tv-reading" points="494.2,534.5 487.2,537.9 487.2,531.1"/><g class="tv-lock" data-for="rel:base-despesas::ClassificadorPorNaturezaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" transform="translate(414.2, 526.9)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-end" data-for="rel:base-despesas::ClassificadorPorNaturezaDeDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="507.3" y="533.1" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text data-for="rel:base-despesas::FonteDaDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="470.3" y="493.7" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">classifica</text><polygon class="tv-reading" points="504.5,490.2 497.5,493.6 497.5,486.8"/><g class="tv-lock" data-for="rel:base-despesas::FonteDaDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" transform="translate(421.9, 389.1)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-end" data-for="rel:base-despesas::FonteDaDespesa-&gt;base-despesas::DespesaOrcamentaria::classifica" x="479.8" y="476.1" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text></g></svg>
