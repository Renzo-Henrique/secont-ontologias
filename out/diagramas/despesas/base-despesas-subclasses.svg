<svg xmlns="http://www.w3.org/2000/svg" viewBox="662 722 799 658" width="799" height="658">
<style>
/* Everything that is text, before anything specialises it. The label layer sits
   above the boxes and outside every other group, so a rule that reached labels
   through their edge stopped reaching them the day they were lifted out of it --
   and an SVG with no font-family on a text element falls back to a 16px serif.
   Stated once at the top, no layer can lose it again. */
text {
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-stretch: normal;
    font-size: 11px;
    fill: #1f1c17;
    font-variant-numeric: tabular-nums;
}

.tv-node rect { stroke: #4a453c; stroke-width: 1; }
.tv-node text { fill: #1f1c17; }
.tv-name { font-weight: 600; font-size: 13px; letter-spacing: 0.005em; }
.tv-legend text { font-size: 13px; fill: #1f1c17; }
.tv-stereotype { font-size: 11px; fill-opacity: 0.72; letter-spacing: 0.01em; }
.tv-attribute { font-size: 12px; }
.tv-edge path { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-end { fill: #6e6658; }
/* No letter-spacing on a label drawn with a halo: WebKit places letter-spaced
   SVG text glyph by glyph and then draws no halo, so in Safari, and in an
   exported SVG opened in Preview, the line ran through the label and its
   letters came out uneven. Chromium and Firefox never showed it. */
.tv-edge-stereotype { font-size: 9.5px; fill-opacity: 0.78; }
.tv-marker { fill: #ffffff; stroke: #4a453c; stroke-width: 1.2; }
.tv-arrow { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-reading { fill: #1f1c17; stroke: none; }
.tv-lock { fill: none; stroke: #6e6658; stroke-width: 1.1; stroke-linecap: round; }
.tv-lock rect { fill: #f7f6f2; }
.tv-group rect { fill: none; stroke: #6e6658; stroke-dasharray: 4 3; }
.tv-group text { font-size: 11px; fill: #6e6658; }
.tv-ontology rect { fill: none; stroke: #4a453c; stroke-width: 1.2; stroke-dasharray: none; }
.tv-ontology text { font-weight: 600; font-size: 13px; fill: #1f1c17; }
.tv-location { font-size: 12px; fill-opacity: 0.72; }
.tv-selected rect { stroke: #1f5c5c; stroke-width: 2.5; }
/* The second selector is for a leg of a shared tree, which carries its own id
   and so is chosen as itself rather than through a group around it. */
.tv-selected path, path.tv-selected { stroke: #1f5c5c; stroke-width: 2.2; }
.tv-unresolved rect { stroke-dasharray: 5 3; }
.tv-external rect { stroke-dasharray: 2 2; }
</style>
<rect x="662" y="722" width="799" height="658" fill="#f7f6f2"/>
<g class="tv-group" data-group="pkg:base-despesas"><rect x="678" y="738" width="767" height="626" rx="4"/><text x="686" y="752">base-despesas</text></g><g class="tv-edge" data-edge="gen:base-despesas::DespesaOrcamentariaRegistrada-&gt;base-despesas::DespesaOrcamentaria"><path d="M 837 1056 L 840 1016 L 968 1016 L 971 964"/><polygon class="tv-marker" points="971,964 962.2,977.5 978.2,978.4"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:"><path d="M 1102 1090 L 1152 1168"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::CriacaoDeDespesaNaoPaga:creation:"><path d="M 1301 1090 L 1194 1168"/></g><g class="tv-edge" data-edge="rel:base-despesas::RegistroDeDespesaOrcamentaria-&gt;base-despesas::DespesaOrcamentariaRegistrada:mediation:"><path d="M 807 1216 L 807 1098"/></g><g class="tv-edge" data-edge="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers"><path d="M 1169 1304 L 1166 1210"/></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::EstagiosDaDespesaEmExecucao"><polygon class="tv-marker" points="1112,953 1103,939 1121,939"/><path d="M 1112 939 L 1112 889"/><path d="M 951 889 L 1333 889"/><path data-edge="gen:base-despesas::DespesaDeEmpenho-&gt;base-despesas::DespesaOrcamentaria" d="M 951 889 L 951 818"/><path data-edge="gen:base-despesas::DespesaDeLiquidacao-&gt;base-despesas::DespesaOrcamentaria" d="M 1134 889 L 1134 818"/><path data-edge="gen:base-despesas::DespesaDePagamento-&gt;base-despesas::DespesaOrcamentaria" d="M 1333 889 L 1333 818"/><text data-for="set:base-despesas::EstagiosDaDespesaEmExecucao" x="1142" y="905" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">EstagiosDaDespesaEmExecucao {disjoint, complete}</text></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::DespesaPorVigencia"><polygon class="tv-marker" points="1136,995 1127,1009 1145,1009"/><path d="M 1136 1009 L 1136 1039"/><path d="M 1088.5 1039 L 1329.5 1039"/><path data-edge="gen:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::DespesaOrcamentaria" d="M 1088.5 1039 L 1088.5 1048"/><path data-edge="gen:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::DespesaOrcamentaria" d="M 1329.5 1039 L 1329.5 1048"/><text data-for="set:base-despesas::DespesaPorVigencia" x="1209" y="1033" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">DespesaPorVigencia {disjoint, complete}</text></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentaria"><title>*pt-br* — Despesa orçamentária é toda transação que depende de autorização legislativa, na forma de consignação de dotação orçamentária, para ser efetivada.
Cite MCASP - 11º Edição: Parte I: Seção 4.1</title><rect x="1031" y="953" width="153" height="42" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="1107.5" y="968" text-anchor="middle">«kind»</text><text class="tv-name" x="1107.5" y="985" text-anchor="middle">DespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::RegistroDeDespesaOrcamentaria"><title>*pt-br* — Registro que associa o documento contábil de despesa à unidade gestora emitente.</title><rect x="696" y="1216" width="221" height="42" rx="3" fill="#99FF99"/><text class="tv-stereotype" x="806.5" y="1231" text-anchor="middle">«relator»</text><text class="tv-name" x="806.5" y="1248" text-anchor="middle">RegistroDeDespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::DespesaDeEmpenho"><title>*pt-br* — Empenho, segundo o art. 58 da Lei nº 4.320/1964, é o ato emanado de autoridade competente que cria para o Estado obrigação de pagamento pendente ou não de implemento de condição. Consiste na reserva de dotação orçamentária para um fim específico.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.1</title><rect x="880" y="776" width="142" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="951" y="791" text-anchor="middle">«phase»</text><text class="tv-name" x="951" y="808" text-anchor="middle">DespesaDeEmpenho</text></g><g class="tv-node" data-node="base-despesas::DespesaDeLiquidacao"><title>*pt-br* — Conforme dispõe o art. 63 da Lei nº 4.320/1964, a liquidação consiste na verificação do direito adquirido pelo credor tendo por base os títulos e documentos comprobatórios do respectivo crédito
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.3</title><rect x="1056" y="776" width="156" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1134" y="791" text-anchor="middle">«phase»</text><text class="tv-name" x="1134" y="808" text-anchor="middle">DespesaDeLiquidacao</text></g><g class="tv-node" data-node="base-despesas::DespesaDePagamento"><title>*pt-br* — O pagamento consiste na entrega de numerário ao credor por meio de cheque nominativo, ordens de pagamentos ou crédito em conta, e só pode ser efetuado após a regular liquidação da despesa. A Lei nº 4.320/1964, no art. 64, define ordem de pagamento como sendo o despacho exarado por autoridade competente, determinando que a despesa liquidada seja paga. A ordem de pagamento só pode ser exarada em documentos processados pelos serviços de contabilidade.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.4</title><rect x="1256" y="776" width="154" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1333" y="791" text-anchor="middle">«phase»</text><text class="tv-name" x="1333" y="808" text-anchor="middle">DespesaDePagamento</text></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentariaRegistrada"><title>Agrupa os papeis das despesas que são representadas por arquivos no Portal da Transparência.</title><rect x="696" y="1056" width="221" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="806.5" y="1071" text-anchor="middle">«role»</text><text class="tv-name" x="806.5" y="1088" text-anchor="middle">DespesaOrcamentariaRegistrada</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioVigente"><title>*pt-br* — Despesa empenhada que foi paga no mesmo exercício vigente em que foi emitida</title><rect x="992" y="1048" width="193" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1088.5" y="1063" text-anchor="middle">«subkind»</text><text class="tv-name" x="1088.5" y="1080" text-anchor="middle">DespesaDeExercicioVigente</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioAnterior"><title>*pt-br* — São Restos a Pagar todas as despesas regularmente empenhadas, do exercício atual ou anterior, mas não pagas até 31 de dezembro do exercício financeiro vigente.
Cite MCASP - 11º Edição: Parte I: Seção 4.7</title><rect x="1232" y="1048" width="195" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1329.5" y="1063" text-anchor="middle">«subkind»</text><text class="tv-name" x="1329.5" y="1080" text-anchor="middle">DespesaDeExercicioAnterior</text></g><g class="tv-node" data-node="base-despesas::TerminoDoExercicioVigenteDaDespesa"><title>*pt-br* — No fim do exercício, as despesas orçamentárias empenhadas e não pagas serão inscritas em restos a pagar.
Cite MCASP - 11º Edição: Parte I: Seção 4.7.1</title><rect x="1040" y="1304" width="260" height="42" rx="3" fill="#FCE0C0"/><text class="tv-stereotype" x="1170" y="1319" text-anchor="middle">«situation»</text><text class="tv-name" x="1170" y="1336" text-anchor="middle">TerminoDoExercicioVigenteDaDespesa</text></g><g class="tv-node" data-node="base-despesas::CriacaoDeDespesaNaoPaga"><title>*pt-br* — Evento de criação de uma despesa empenhada que NÃO foi paga no mesmo exercício vigente em que foi emitida</title><rect x="1072" y="1168" width="187" height="42" rx="3" fill="#FCFCD4"/><text class="tv-stereotype" x="1165.5" y="1183" text-anchor="middle">«event»</text><text class="tv-name" x="1165.5" y="1200" text-anchor="middle">CriacaoDeDespesaNaoPaga</text></g><g class="tv-labels"><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:" x="1122.5" y="1137" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«termination»</text><polygon class="tv-reading" points="1159.1,1137.5 1155.7,1130.5 1162.5,1130.5"/><text class="tv-end" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:" x="1159.6" y="1151.7" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0..1</text><text class="tv-edge-stereotype" data-for="rel:base-despesas::RegistroDeDespesaOrcamentaria-&gt;base-despesas::DespesaOrcamentariaRegistrada:mediation:" x="802.5" y="1165" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«mediation»</text><polygon class="tv-reading" points="836,1158.5 839.4,1165.5 832.6,1165.5"/><text class="tv-edge-stereotype" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1167.5" y="1258" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«triggering»</text><text data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1163" y="1271" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">triggers</text><polygon class="tv-reading" points="1187.8,1264 1191.2,1271 1184.4,1271"/><text class="tv-end" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1178.3" y="1226.6" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text class="tv-end" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1119.5" y="1228.3" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">{addOnly}</text><g class="tv-lock" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" transform="translate(1146.4, 1220.3)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::CriacaoDeDespesaNaoPaga:creation:" x="1252" y="1133" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«creation»</text><polygon class="tv-reading" points="1218.6,1130 1225.6,1126.6 1225.6,1133.4"/></g></svg>
