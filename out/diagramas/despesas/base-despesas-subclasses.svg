<svg xmlns="http://www.w3.org/2000/svg" viewBox="302 402 1031 634" width="1031" height="634">
<style>
/* Everything that is text, before anything specialises it. The label layer sits
   above the boxes and outside every other group, so a rule that reached labels
   through their edge stopped reaching them the day they were lifted out of it --
   and an SVG with no font-family on a text element falls back to a 16px serif.
   Stated once at the top, no layer can lose it again. */
text {
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-stretch: normal;
    font-size: 11px;
    fill: #1f1c17;
    font-variant-numeric: tabular-nums;
}

.tv-node rect { stroke: #4a453c; stroke-width: 1; }
.tv-node text { fill: #1f1c17; }
.tv-name { font-weight: 600; font-size: 13px; letter-spacing: 0.005em; }
.tv-legend text { font-size: 13px; fill: #1f1c17; }
.tv-stereotype { font-size: 11px; fill-opacity: 0.72; letter-spacing: 0.01em; }
.tv-attribute { font-size: 12px; }
.tv-edge path { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-end { fill: #6e6658; }
/* No letter-spacing on a label drawn with a halo: WebKit places letter-spaced
   SVG text glyph by glyph and then draws no halo, so in Safari, and in an
   exported SVG opened in Preview, the line ran through the label and its
   letters came out uneven. Chromium and Firefox never showed it. */
.tv-edge-stereotype { font-size: 9.5px; fill-opacity: 0.78; }
.tv-marker { fill: #ffffff; stroke: #4a453c; stroke-width: 1.2; }
.tv-arrow { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-reading { fill: #1f1c17; stroke: none; }
.tv-lock { fill: none; stroke: #6e6658; stroke-width: 1.1; stroke-linecap: round; }
.tv-lock rect { fill: #f7f6f2; }
.tv-group rect { fill: none; stroke: #6e6658; stroke-dasharray: 4 3; }
.tv-group text { font-size: 11px; fill: #6e6658; }
.tv-ontology rect { fill: none; stroke: #4a453c; stroke-width: 1.2; stroke-dasharray: none; }
.tv-ontology text { font-weight: 600; font-size: 13px; fill: #1f1c17; }
.tv-location { font-size: 12px; fill-opacity: 0.72; }
.tv-selected rect { stroke: #1f5c5c; stroke-width: 2.5; }
/* The second selector is for a leg of a shared tree, which carries its own id
   and so is chosen as itself rather than through a group around it. */
.tv-selected path, path.tv-selected { stroke: #1f5c5c; stroke-width: 2.2; }
.tv-unresolved rect { stroke-dasharray: 5 3; }
.tv-external rect { stroke-dasharray: 2 2; }
</style>
<rect x="302" y="402" width="1031" height="634" fill="#f7f6f2"/>
<g class="tv-group" data-group="pkg:base-despesas"><rect x="318" y="418" width="999" height="602" rx="4"/><text x="326" y="432">base-despesas</text></g><g class="tv-edge" data-edge="gen:base-despesas::Despesa-&gt;base-despesas::DespesaDeExercicioVigente"><path d="M 876 744 L 962 618"/><polygon class="tv-marker" points="962,618 947.5,625.1 960.7,634.1"/></g><g class="tv-edge" data-edge="gen:base-despesas::Despesa-&gt;base-despesas::DespesaDePagamento"><path d="M 845 744 L 781 666"/><polygon class="tv-marker" points="781,666 783.7,681.9 796.1,671.7"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:"><path d="M 989 618 L 1049 720"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::CriacaoDeDespesaNaoPaga:creation:"><path d="M 1181 618 L 1082 720"/></g><g class="tv-edge" data-edge="gen:base-despesas::RestosAPagar-&gt;base-despesas::DespesaDeExercicioAnterior"><path d="M 1062 960 L 1202 928 L 1197 618"/><polygon class="tv-marker" points="1197,618 1189.2,632.1 1205.2,631.9"/></g><g class="tv-edge" data-edge="gen:base-despesas::RestosAPagar-&gt;base-despesas::DespesaDePagamento"><path d="M 1034 960 L 898 928 L 768 928 L 761 666"/><polygon class="tv-marker" points="761,666 753.4,680.2 769.4,679.8"/></g><g class="tv-edge" data-edge="gen:base-despesas::OrcamentoDeDespesa-&gt;base-despesas::DespesaDeEmpenho"><path d="M 411 800 L 408 698"/><polygon class="tv-marker" points="408,698 400.4,712.2 416.4,711.8"/></g><g class="tv-edge" data-edge="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers"><path d="M 1052 864 L 1060 762"/></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::EstagiosDaDespesaEmExecucao"><polygon class="tv-marker" points="598,498 589,512 607,512"/><path d="M 598 512 L 598 558"/><path d="M 407 558 L 741 558"/><path data-edge="gen:base-despesas::DespesaDeEmpenho-&gt;base-despesas::DocumentoContabilDeDespesaOrcamentaria" d="M 407 558 L 407 656"/><path data-edge="gen:base-despesas::DespesaDeLiquidacao-&gt;base-despesas::DocumentoContabilDeDespesaOrcamentaria" d="M 574 558 L 574 656"/><path data-edge="gen:base-despesas::DespesaDePagamento-&gt;base-despesas::DocumentoContabilDeDespesaOrcamentaria" d="M 741 558 L 741 624"/><text data-for="set:base-despesas::EstagiosDaDespesaEmExecucao" x="574" y="552" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">EstagiosDaDespesaEmExecucao {disjoint, complete}</text></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::DespesaPorVigencia"><polygon class="tv-marker" points="705,498 696,512 714,512"/><path d="M 705 512 L 705 544"/><path d="M 705 544 L 1201.5 544"/><path data-edge="gen:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::DocumentoContabilDeDespesaOrcamentaria" d="M 976.5 544 L 976.5 576"/><path data-edge="gen:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::DocumentoContabilDeDespesaOrcamentaria" d="M 1201.5 544 L 1201.5 576"/><text data-for="set:base-despesas::DespesaPorVigencia" x="953.3" y="538" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">DespesaPorVigencia {disjoint, complete}</text></g><g class="tv-node" data-node="base-despesas::DocumentoContabilDeDespesaOrcamentaria"><title>*pt-br* — Despesa orçamentária é toda transação que depende de autorização legislativa, na forma de consignação de dotação orçamentária, para ser efetivada.
Cite MCASP - 11º Edição: Parte I: Seção 4.1</title><rect x="456" y="456" width="291" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="601.5" y="471" text-anchor="middle">«subkind»</text><text class="tv-name" x="601.5" y="488" text-anchor="middle">DocumentoContabilDeDespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::Despesa"><title>*pt-br* — Documento contabil referente aos arquivos &quot;Despesas&quot;</title><rect x="808" y="744" width="108" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="862" y="759" text-anchor="middle">«role»</text><text class="tv-name" x="862" y="776" text-anchor="middle">Despesa</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioVigente"><title>*pt-br* — Despesa empenhada que foi paga no mesmo exercício vigente em que foi emitida</title><rect x="880" y="576" width="193" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="976.5" y="591" text-anchor="middle">«subkind»</text><text class="tv-name" x="976.5" y="608" text-anchor="middle">DespesaDeExercicioVigente</text></g><g class="tv-node" data-node="base-despesas::DespesaDePagamento"><title>*pt-br* — O pagamento consiste na entrega de numerário ao credor por meio de cheque nominativo, ordens de pagamentos ou crédito em conta, e só pode ser efetuado após a regular liquidação da despesa. A Lei nº 4.320/1964, no art. 64, define ordem de pagamento como sendo o despacho exarado por autoridade competente, determinando que a despesa liquidada seja paga. A ordem de pagamento só pode ser exarada em documentos processados pelos serviços de contabilidade.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.4</title><rect x="664" y="624" width="154" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="741" y="639" text-anchor="middle">«phase»</text><text class="tv-name" x="741" y="656" text-anchor="middle">DespesaDePagamento</text></g><g class="tv-node" data-node="base-despesas::DespesaDeEmpenho"><title>*pt-br* — A etapa do planejamento abrange, de modo geral, toda a análise para a formulação do plano e ações governamentais que servirão de base para a fixação da despesa orçamentária, a descentralização/movimentação de créditos, a programação orçamentária e financeira, e o processo de licitação e contratação.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.1</title><rect x="336" y="656" width="142" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="407" y="671" text-anchor="middle">«phase»</text><text class="tv-name" x="407" y="688" text-anchor="middle">DespesaDeEmpenho</text></g><g class="tv-node" data-node="base-despesas::DespesaDeLiquidacao"><title>*pt-br* — Conforme dispõe o art. 63 da Lei nº 4.320/1964, a liquidação consiste na verificação do direito adquirido pelo credor tendo por base os títulos e documentos comprobatórios do respectivo crédito
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.3</title><rect x="496" y="656" width="156" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="574" y="671" text-anchor="middle">«phase»</text><text class="tv-name" x="574" y="688" text-anchor="middle">DespesaDeLiquidacao</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioAnterior"><title>*pt-br* — São Restos a Pagar todas as despesas regularmente empenhadas, do exercício atual ou anterior, mas não pagas até 31 de dezembro do exercício financeiro vigente.
Cite MCASP - 11º Edição: Parte I: Seção 4.7</title><rect x="1104" y="576" width="195" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1201.5" y="591" text-anchor="middle">«subkind»</text><text class="tv-name" x="1201.5" y="608" text-anchor="middle">DespesaDeExercicioAnterior</text></g><g class="tv-node" data-node="base-despesas::TerminoDoExercicioVigenteDaDespesa"><title>*pt-br* — No fim do exercício, as despesas orçamentárias empenhadas e não pagas serão inscritas em restos a pagar.
Cite MCASP - 11º Edição: Parte I: Seção 4.7.1</title><rect x="920" y="864" width="260" height="42" rx="3" fill="#FCE0C0"/><text class="tv-stereotype" x="1050" y="879" text-anchor="middle">«situation»</text><text class="tv-name" x="1050" y="896" text-anchor="middle">TerminoDoExercicioVigenteDaDespesa</text></g><g class="tv-node" data-node="base-despesas::CriacaoDeDespesaNaoPaga"><title>*pt-br* — Evento de criação de uma despesa empenhada que NÃO foi paga no mesmo exercício vigente em que foi emitida</title><rect x="968" y="720" width="187" height="42" rx="3" fill="#FCFCD4"/><text class="tv-stereotype" x="1061.5" y="735" text-anchor="middle">«event»</text><text class="tv-name" x="1061.5" y="752" text-anchor="middle">CriacaoDeDespesaNaoPaga</text></g><g class="tv-node" data-node="base-despesas::RestosAPagar"><title>*pt-br* — Documento contabil referente aos arquivos &quot;RestosAPagar&quot;</title><rect x="1000" y="960" width="108" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1054" y="975" text-anchor="middle">«role»</text><text class="tv-name" x="1054" y="992" text-anchor="middle">RestosAPagar</text></g><g class="tv-node" data-node="base-despesas::OrcamentoDeDespesa"><title>*pt-br* — Documento contabil referente aos arquivos &quot;OrcamentosDespesa&quot;</title><rect x="336" y="800" width="151" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="411.5" y="815" text-anchor="middle">«role»</text><text class="tv-name" x="411.5" y="832" text-anchor="middle">OrcamentoDeDespesa</text></g><g class="tv-labels"><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:" x="1014.5" y="677" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«termination»</text><polygon class="tv-reading" points="1051.1,677.5 1047.7,670.5 1054.5,670.5"/><text class="tv-end" data-for="rel:base-despesas::DespesaDeExercicioVigente-&g