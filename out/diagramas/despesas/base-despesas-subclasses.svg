<svg xmlns="http://www.w3.org/2000/svg" viewBox="302 186 1803 754" width="1803" height="754">
<style>
/* Everything that is text, before anything specialises it. The label layer sits
   above the boxes and outside every other group, so a rule that reached labels
   through their edge stopped reaching them the day they were lifted out of it --
   and an SVG with no font-family on a text element falls back to a 16px serif.
   Stated once at the top, no layer can lose it again. */
text {
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-stretch: normal;
    font-size: 11px;
    fill: #1f1c17;
    font-variant-numeric: tabular-nums;
}

.tv-node rect { stroke: #4a453c; stroke-width: 1; }
.tv-node text { fill: #1f1c17; }
.tv-name { font-weight: 600; font-size: 13px; letter-spacing: 0.005em; }
.tv-legend text { font-size: 13px; fill: #1f1c17; }
.tv-stereotype { font-size: 11px; fill-opacity: 0.72; letter-spacing: 0.01em; }
.tv-attribute { font-size: 12px; }
.tv-edge path { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-end { fill: #6e6658; }
/* No letter-spacing on a label drawn with a halo: WebKit places letter-spaced
   SVG text glyph by glyph and then draws no halo, so in Safari, and in an
   exported SVG opened in Preview, the line ran through the label and its
   letters came out uneven. Chromium and Firefox never showed it. */
.tv-edge-stereotype { font-size: 9.5px; fill-opacity: 0.78; }
.tv-marker { fill: #ffffff; stroke: #4a453c; stroke-width: 1.2; }
.tv-arrow { fill: none; stroke: #4a453c; stroke-width: 1.2; }
.tv-reading { fill: #1f1c17; stroke: none; }
.tv-lock { fill: none; stroke: #6e6658; stroke-width: 1.1; stroke-linecap: round; }
.tv-lock rect { fill: #f7f6f2; }
.tv-group rect { fill: none; stroke: #6e6658; stroke-dasharray: 4 3; }
.tv-group text { font-size: 11px; fill: #6e6658; }
.tv-ontology rect { fill: none; stroke: #4a453c; stroke-width: 1.2; stroke-dasharray: none; }
.tv-ontology text { font-weight: 600; font-size: 13px; fill: #1f1c17; }
.tv-location { font-size: 12px; fill-opacity: 0.72; }
.tv-selected rect { stroke: #1f5c5c; stroke-width: 2.5; }
/* The second selector is for a leg of a shared tree, which carries its own id
   and so is chosen as itself rather than through a group around it. */
.tv-selected path, path.tv-selected { stroke: #1f5c5c; stroke-width: 2.2; }
.tv-unresolved rect { stroke-dasharray: 5 3; }
.tv-external rect { stroke-dasharray: 2 2; }
</style>
<rect x="302" y="186" width="1803" height="754" fill="#f7f6f2"/>
<g class="tv-group" data-group="pkg:base-despesas"><rect x="318" y="460" width="1771" height="464" rx="4"/><text x="326" y="474">base-despesas</text></g><g class="tv-group" data-group="pkg:nucleo"><rect x="1092" y="202" width="369" height="140" rx="4"/><text x="1100" y="216">nucleo</text></g><g class="tv-edge" data-edge="gen:base-despesas::OrgaoPublicoOrcamentario-&gt;nucleo::OrgaoPublico"><path d="M 1504 652 L 1533 519 L 1402 324"/><polygon class="tv-marker" points="1402,324 1403.2,340.1 1416.4,331.2"/></g><g class="tv-edge" data-edge="gen:base-despesas::UnidadeOrcamentaria-&gt;nucleo::UnidadeDeOrgaoPublico"><path d="M 1192 498 L 1192 324"/><polygon class="tv-marker" points="1192,324 1184,338 1200,338"/></g><g class="tv-edge" data-edge="gen:base-despesas::DespesaOrcamentariaRegistrada-&gt;base-despesas::DespesaOrcamentaria"><path d="M 981 652 L 1095 640 L 1095 554 L 981 540"/><polygon class="tv-marker" points="981,540 993.9,549.6 995.9,533.8"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:"><path d="M 989 618 L 1114 630 L 1114 716 L 1049 720"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::CriacaoDeDespesaNaoPaga:creation:"><path d="M 1181 618 L 1082 720"/></g><g class="tv-edge" data-edge="rel:base-despesas::UnidadeOrcamentaria-&gt;base-despesas::OrgaoPublicoOrcamentario:componenthood:"><path d="M 1235 540 L 1321 554 L 1467 652"/><polygon class="tv-marker" points="1467,652 1463.7,642.6 1453.7,643.1 1457,652.5"/></g><g class="tv-edge" data-edge="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers"><path d="M 1052 864 L 1060 762"/></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::EstagiosDaDespesaEmExecucao"><polygon class="tv-marker" points="904,540 895,554 913,554"/><path d="M 904 554 L 904 569"/><path d="M 407 569 L 904 569"/><path data-edge="gen:base-despesas::DespesaDeEmpenho-&gt;base-despesas::DespesaOrcamentaria" d="M 407 569 L 407 656"/><path data-edge="gen:base-despesas::DespesaDeLiquidacao-&gt;base-despesas::DespesaOrcamentaria" d="M 574 569 L 574 656"/><path data-edge="gen:base-despesas::DespesaDePagamento-&gt;base-despesas::DespesaOrcamentaria" d="M 741 569 L 741 624"/><text data-for="set:base-despesas::EstagiosDaDespesaEmExecucao" x="655.5" y="563" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">EstagiosDaDespesaEmExecucao {disjoint, complete}</text></g><g class="tv-edge tv-tree" data-genset="set:base-despesas::DespesaPorVigencia"><polygon class="tv-marker" points="1020,540 1011,554 1029,554"/><path d="M 1020 554 L 1020 569"/><path d="M 976.5 569 L 1201.5 569"/><path data-edge="gen:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::DespesaOrcamentaria" d="M 976.5 569 L 976.5 576"/><path data-edge="gen:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::DespesaOrcamentaria" d="M 1201.5 569 L 1201.5 576"/><text data-for="set:base-despesas::DespesaPorVigencia" x="1133.4" y="563" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">DespesaPorVigencia {disjoint, complete}</text></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentaria"><title>*pt-br* — Despesa orçamentária é toda transação que depende de autorização legislativa, na forma de consignação de dotação orçamentária, para ser efetivada.
Cite MCASP - 11º Edição: Parte I: Seção 4.1</title><rect x="904" y="498" width="153" height="42" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="980.5" y="513" text-anchor="middle">«kind»</text><text class="tv-name" x="980.5" y="530" text-anchor="middle">DespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::ClassificacaoDoRegistroDeDespesaOrcamentaria"><title>*pt-br* — Relator que associa a Receita às classificações de natureza, fonte e conta contábil.</title><rect x="1746" y="498" width="325" height="42" rx="3" fill="#99FF99"/><text class="tv-stereotype" x="1908.5" y="513" text-anchor="middle">«relator»</text><text class="tv-name" x="1908.5" y="530" text-anchor="middle">ClassificacaoDoRegistroDeDespesaOrcamentaria</text></g><g class="tv-node" data-node="base-despesas::UnidadeGestoraNaDespesa"><title>*pt-br* — Unidade gestora responsável pela emissão do documento contábil de despesa.</title><rect x="1327" y="498" width="184" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1419" y="513" text-anchor="middle">«role»</text><text class="tv-name" x="1419" y="530" text-anchor="middle">UnidadeGestoraNaDespesa</text></g><g class="tv-node" data-node="base-despesas::OrgaoPublicoOrcamentario"><title>*pt-br* — Os órgãos orçamentários, por sua vez, correspondem a agrupamentos de unidades orçamentárias. As dotações são consignadas às unidades orçamentárias, responsáveis pela realização das ações.
Cite MCASP - 11º Edicao: Parte Il: Seções 4.2.1</title><rect x="1419" y="652" width="183" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1510.5" y="667" text-anchor="middle">«role»</text><text class="tv-name" x="1510.5" y="684" text-anchor="middle">OrgaoPublicoOrcamentario</text></g><g class="tv-node tv-external" data-node="nucleo::OrgaoPublico"><title>*pt-br* — É a unidade de atuação integrante da estrutura da Administração direta e da estrutura da Administração indireta;
Cite LEI Nº 9.784 , DE 29 DE JANEIRO DE 1999.</title><rect x="1335" y="240" width="108" height="84" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="1389" y="255" text-anchor="middle">«kind»</text><text class="tv-name" x="1389" y="272" text-anchor="middle">OrgaoPublico</text><line x1="1335" y1="282" x2="1443" y2="282" stroke="#4a453c" stroke-width="1"/><text class="tv-attribute" x="1343" y="298">codigo: string</text><text class="tv-attribute" x="1343" y="315">descricao: string</text></g><g class="tv-node" data-node="base-despesas::UnidadeOrcamentaria"><rect x="1117" y="498" width="150" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1192" y="513" text-anchor="middle">«role»</text><text class="tv-name" x="1192" y="530" text-anchor="middle">UnidadeOrcamentaria</text></g><g class="tv-node tv-external" data-node="nucleo::UnidadeDeOrgaoPublico"><title>*pt-br* — Constitui unidade orçamentária o agrupamento de serviços subordinados ao mesmo órgão ou repartição a que serão consignadas dotações próprias.
Cite LEI No 4.320, DE 17 DE MARÇO DE 1964</title><rect x="1110" y="240" width="165" height="84" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="1192.5" y="255" text-anchor="middle">«kind»</text><text class="tv-name" x="1192.5" y="272" text-anchor="middle">UnidadeDeOrgaoPublico</text><line x1="1110" y1="282" x2="1275" y2="282" stroke="#4a453c" stroke-width="1"/><text class="tv-attribute" x="1118" y="298">codigo: string</text><text class="tv-attribute" x="1118" y="315">descricao: string</text></g><g class="tv-node" data-node="base-despesas::DespesaDeEmpenho"><title>*pt-br* — Empenho, segundo o art. 58 da Lei nº 4.320/1964, é o ato emanado de autoridade competente que cria para o Estado obrigação de pagamento pendente ou não de implemento de condição. Consiste na reserva de dotação orçamentária para um fim específico.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.1</title><rect x="336" y="656" width="142" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="407" y="671" text-anchor="middle">«phase»</text><text class="tv-name" x="407" y="688" text-anchor="middle">DespesaDeEmpenho</text></g><g class="tv-node" data-node="base-despesas::DespesaDeLiquidacao"><title>*pt-br* — Conforme dispõe o art. 63 da Lei nº 4.320/1964, a liquidação consiste na verificação do direito adquirido pelo credor tendo por base os títulos e documentos comprobatórios do respectivo crédito
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.3</title><rect x="496" y="656" width="156" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="574" y="671" text-anchor="middle">«phase»</text><text class="tv-name" x="574" y="688" text-anchor="middle">DespesaDeLiquidacao</text></g><g class="tv-node" data-node="base-despesas::DespesaDePagamento"><title>*pt-br* — O pagamento consiste na entrega de numerário ao credor por meio de cheque nominativo, ordens de pagamentos ou crédito em conta, e só pode ser efetuado após a regular liquidação da despesa. A Lei nº 4.320/1964, no art. 64, define ordem de pagamento como sendo o despacho exarado por autoridade competente, determinando que a despesa liquidada seja paga. A ordem de pagamento só pode ser exarada em documentos processados pelos serviços de contabilidade.
Cite MCASP - 11º Edição: Parte I: Seção 4.4.2.4</title><rect x="664" y="624" width="154" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="741" y="639" text-anchor="middle">«phase»</text><text class="tv-name" x="741" y="656" text-anchor="middle">DespesaDePagamento</text></g><g class="tv-node" data-node="base-despesas::DespesaOrcamentariaRegistrada"><title>Agrupa os papeis das despesas que são representadas por arquivos no Portal da Transparência.</title><rect x="871" y="652" width="221" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="981.5" y="667" text-anchor="middle">«role»</text><text class="tv-name" x="981.5" y="684" text-anchor="middle">DespesaOrcamentariaRegistrada</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioVigente"><title>*pt-br* — Despesa empenhada que foi paga no mesmo exercício vigente em que foi emitida</title><rect x="880" y="576" width="193" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="976.5" y="591" text-anchor="middle">«subkind»</text><text class="tv-name" x="976.5" y="608" text-anchor="middle">DespesaDeExercicioVigente</text></g><g class="tv-node" data-node="base-despesas::DespesaDeExercicioAnterior"><title>*pt-br* — São Restos a Pagar todas as despesas regularmente empenhadas, do exercício atual ou anterior, mas não pagas até 31 de dezembro do exercício financeiro vigente.
Cite MCASP - 11º Edição: Parte I: Seção 4.7</title><rect x="1104" y="576" width="195" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="1201.5" y="591" text-anchor="middle">«subkind»</text><text class="tv-name" x="1201.5" y="608" text-anchor="middle">DespesaDeExercicioAnterior</text></g><g class="tv-node" data-node="base-despesas::TerminoDoExercicioVigenteDaDespesa"><title>*pt-br* — No fim do exercício, as despesas orçamentárias empenhadas e não pagas serão inscritas em restos a pagar.
Cite MCASP - 11º Edição: Parte I: Seção 4.7.1</title><rect x="920" y="864" width="260" height="42" rx="3" fill="#FCE0C0"/><text class="tv-stereotype" x="1050" y="879" text-anchor="middle">«situation»</text><text class="tv-name" x="1050" y="896" text-anchor="middle">TerminoDoExercicioVigenteDaDespesa</text></g><g class="tv-node" data-node="base-despesas::CriacaoDeDespesaNaoPaga"><title>*pt-br* — Evento de criação de uma despesa empenhada que NÃO foi paga no mesmo exercício vigente em que foi emitida</title><rect x="968" y="720" width="187" height="42" rx="3" fill="#FCFCD4"/><text class="tv-stereotype" x="1061.5" y="735" text-anchor="middle">«event»</text><text class="tv-name" x="1061.5" y="752" text-anchor="middle">CriacaoDeDespesaNaoPaga</text></g><g class="tv-labels"><text class="tv-edge-stereotype" data-for="rel:base-despesas::UnidadeOrcamentaria-&gt;base-despesas::OrgaoPublicoOrcamentario:componenthood:" x="1357.8" y="582.7" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«componenthood»</text><text class="tv-end" data-for="rel:base-despesas::UnidadeOrcamentaria-&gt;base-despesas::OrgaoPublicoOrcamentario:componenthood:" x="1278.6" y="533.4" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">1..*</text><g class="tv-lock" data-for="rel:base-despesas::UnidadeOrcamentaria-&gt;base-despesas::OrgaoPublicoOrcamentario:componenthood:" transform="translate(1266.8, 552.1)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:" x="1109.5" y="650.8" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«termination»</text><polygon class="tv-reading" points="1146.1,651.3 1142.7,644.3 1149.5,644.3"/><text class="tv-end" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas::CriacaoDeDespesaNaoPaga:termination:" x="1061.1" y="705.7" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0..1</text><text class="tv-edge-stereotype" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1056" y="814" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«triggering»</text><text data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1051.5" y="827" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">triggers</text><polygon class="tv-reading" points="1076.3,820 1079.7,827 1072.9,827"/><text class="tv-end" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1047.1" y="778" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">*</text><text class="tv-end" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" x="1090.8" y="782" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">{addOnly}</text><g class="tv-lock" data-for="rel:base-despesas::TerminoDoExercicioVigenteDaDespesa-&gt;base-despesas::CriacaoDeDespesaNaoPaga:triggering:triggers" transform="translate(1117.7, 774)" aria-label="not const"><title>this end may change (not const)</title><path d="M 1.4 4.6 V 2.9 a 2.5 2.5 0 0 1 5 0"/><rect x="2.8" y="4.6" width="6.8" height="5.4" rx="1.3" stroke="#6e6658"/></g><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioAnterior-&gt;base-despesas::CriacaoDeDespesaNaoPaga:creation:" x="1127" y="677" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«creation»</text><polygon class="tv-reading" points="1156.9,677.5 1153.5,670.5 1160.3,670.5"/></g></svg>
