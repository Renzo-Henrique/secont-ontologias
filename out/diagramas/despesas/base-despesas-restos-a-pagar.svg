<g class="tv-group" data-group="pkg:base-despesas-restos-a-pagar"><rect x="30" y="354" width="968" height="442" rx="4"/><text x="38" y="368">base-despesas-restos-a-pagar</text></g><g class="tv-group" data-group="pkg:nucleo"><rect x="454" y="970" width="174" height="98" rx="4"/><text x="462" y="984">nucleo</text></g><g class="tv-group" data-group="pkg:base-despesas"><rect x="86" y="818" width="789" height="98" rx="4"/><text x="94" y="832">base-despesas</text></g><g class="tv-edge" data-edge="gen:base-despesas-restos-a-pagar::DocumentoContabilDeRestosAPagar-&gt;base-despesas-restos-a-pagar::DespesaDeExercicioAnterior"><path d="M 519 538 L 514 736"/><polygon class="tv-marker" points="514,736 522.4,722.2 506.4,721.8"/></g><g class="tv-edge" data-edge="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:termination:"><path d="M 760 856 L 758 698"/></g><g class="tv-edge" data-edge="rel:base-despesas-restos-a-pagar::DocumentoContabilDeRestosAPagar-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:creation:"><path d="M 551 538 L 726 656"/></g><g class="tv-edge" data-edge="rel:base-despesas-restos-a-pagar::RegistroDeRestosAPagar-&gt;base-despesas-restos-a-pagar::DocumentoContabilDeRestosAPagar:mediation:"><path d="M 300 640 L 482 538"/></g><g class="tv-edge" data-edge="rel:base-despesas-restos-a-pagar::RegistroDeRestosAPagar-&gt;base-despesas-restos-a-pagar::UnidadeGestoraComRestosAPagar:mediation:"><path d="M 216 640 L 174 434"/></g><g class="tv-edge" data-edge="rel:base-despesas-restos-a-pagar::RegistroDeRestosAPagar-&gt;base-despesas::ClassificadorPorNaturezaDeDespesa:mediation:ClassificadoPor"><path d="M 225 724 L 227 856"/></g><g class="tv-edge" data-edge="rel:base-despesas-restos-a-pagar::TerminoDoExercicioDeDespesaVigente-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:triggering:triggers"><path d="M 838 538 L 770 656"/></g><g class="tv-edge tv-tree" data-genset="set:base-despesas-restos-a-pagar::DespesaPorVigencia"><polygon class="tv-marker" points="556,1008 547,994 565,994"/><path d="M 556 994 L 556 946"/><path d="M 513.5 946 L 760.5 946"/><path data-edge="gen:base-despesas::DespesaDeExercicioVigente-&gt;nucleo::DocumentoContabil" d="M 760.5 946 L 760.5 898"/><path data-edge="gen:base-despesas-restos-a-pagar::DespesaDeExercicioAnterior-&gt;nucleo::DocumentoContabil" d="M 513.5 946 L 513.5 778"/><text data-for="set:base-despesas-restos-a-pagar::DespesaPorVigencia" x="637" y="962" fill="#6e6658" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">DespesaPorVigencia {disjoint}</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::UnidadeGestoraComRestosAPagar"><rect x="56" y="392" width="227" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="169.5" y="407" text-anchor="middle">«role»</text><text class="tv-name" x="169.5" y="424" text-anchor="middle">UnidadeGestoraComRestosAPagar</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::DespesaDeExercicioAnterior"><rect x="416" y="736" width="195" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="513.5" y="751" text-anchor="middle">«subkind»</text><text class="tv-name" x="513.5" y="768" text-anchor="middle">DespesaDeExercicioAnterior</text></g><g class="tv-node tv-external" data-node="nucleo::DocumentoContabil"><title>*pt-br* — O objetivo da elaboração e divulgação da informação contábil é fornecer informação para fins de prestação de contas e responsabilização (accountability) e tomada de decisão.
Cite MCASP - 11º Edicao: Parte Geral: Seções 2.3 ; 3.1</title><rect x="472" y="1008" width="138" height="42" rx="3" fill="#FF99A3"/><text class="tv-stereotype" x="541" y="1023" text-anchor="middle">«kind»</text><text class="tv-name" x="541" y="1040" text-anchor="middle">DocumentoContabil</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::DocumentoContabilDeRestosAPagar"><title>São Restos a Pagar todas as despesas regularmente empenhadas, do exercício atual ou anterior, mas não pagas até 31 de dezembro do exercício financeiro vigente. Distingue-se dois tipos de restos a pagar: os processados (despesas já liquidadas); e os não processados (despesas a liquidar ou em liquidação).
Cite MCASP - 11º Edição: Parte I: Seção 4.7</title><rect x="400" y="496" width="240" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="520" y="511" text-anchor="middle">«historicalRole»</text><text class="tv-name" x="520" y="528" text-anchor="middle">DocumentoContabilDeRestosAPagar</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::DadosDeRestosAPagarAnonimizados"><rect x="392" y="400" width="245" height="42" rx="3" fill="#FFFFFF"/><text class="tv-stereotype" x="514.5" y="415" text-anchor="middle">«datatype»</text><text class="tv-name" x="514.5" y="432" text-anchor="middle">DadosDeRestosAPagarAnonimizados</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::RegistroDeRestosAPagar"><rect x="48" y="640" width="353" height="84" rx="3" fill="#99FF99"/><text class="tv-stereotype" x="224.5" y="655" text-anchor="middle">«relator»</text><text class="tv-name" x="224.5" y="672" text-anchor="middle">RegistroDeRestosAPagar</text><line x1="48" y1="682" x2="401" y2="682" stroke="#4a453c" stroke-width="1"/><text class="tv-attribute" x="56" y="698">dadosAnonimizados: const DadosDeRestosAPagarAnonimizados</text><text class="tv-attribute" x="56" y="715">poder: const PoderDaFederacao</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga"><rect x="664" y="656" width="187" height="42" rx="3" fill="#FCFCD4"/><text class="tv-stereotype" x="757.5" y="671" text-anchor="middle">«event»</text><text class="tv-name" x="757.5" y="688" text-anchor="middle">CriacaoDeDespesaNaoPaga</text></g><g class="tv-node" data-node="base-despesas-restos-a-pagar::TerminoDoExercicioDeDespesaVigente"><title>No fim do exercício, as despesas orçamentárias empenhadas e não pagas serão inscritas em restos a pagar.
Cite MCASP - 11º Edição: Parte I: Seção 4.7.1</title><rect x="720" y="496" width="260" height="42" rx="3" fill="#FCE0C0"/><text class="tv-stereotype" x="850" y="511" text-anchor="middle">«situation»</text><text class="tv-name" x="850" y="528" text-anchor="middle">TerminoDoExercicioDeDespesaVigente</text></g><g class="tv-node tv-external" data-node="base-despesas::DespesaDeExercicioVigente"><rect x="664" y="856" width="193" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="760.5" y="871" text-anchor="middle">«subkind»</text><text class="tv-name" x="760.5" y="888" text-anchor="middle">DespesaDeExercicioVigente</text></g><g class="tv-node tv-external" data-node="base-despesas::ClassificadorPorNaturezaDeDespesa"><title>*pt-br* — A classificação da despesa orçamentária, segundo a sua natureza, compõe-se de: a. Categoria Econômica ; b. Grupo de Natureza da Despesa ; c. Elemento de Despesa.  A natureza da despesa será complementada pela informação gerencial denominada &quot;Modalidade de Aplicação&quot;, a qual tem por finalidade indicar se os recursos são aplicados diretamente por órgãos ou entidades no âmbito da mesma esfera de Governo ou por outro ente da Federação e suas respectivas entidades, e objetiva, precipuamente, possibilitar a eliminação da dupla contagem dos recursos transferidos ou descentralizados.
Cite MCASP - 11º Edição: Parte I: Seção 4.2.4</title><rect x="104" y="856" width="246" height="42" rx="3" fill="#FFDADD"/><text class="tv-stereotype" x="227" y="871" text-anchor="middle">«category»</text><text class="tv-name" x="227" y="888" text-anchor="middle">ClassificadorPorNaturezaDeDespesa</text></g><g class="tv-labels"><text class="tv-edge-stereotype" data-for="rel:base-despesas-restos-a-pagar::RegistroDeRestosAPagar-&gt;base-despesas::ClassificadorPorNaturezaDeDespesa:mediation:ClassificadoPor" x="226" y="791" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«mediation»</text><text data-for="rel:base-despesas-restos-a-pagar::RegistroDeRestosAPagar-&gt;base-despesas::ClassificadorPorNaturezaDeDespesa:mediation:ClassificadoPor" x="221.5" y="804" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">ClassificadoPor</text><polygon class="tv-reading" points="266,804 262.6,797 269.4,797"/><text class="tv-edge-stereotype" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:termination:" x="754.5" y="785" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">«termination»</text><polygon class="tv-reading" points="791.1,778.5 794.5,785.5 787.7,785.5"/><text class="tv-end" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:termination:" x="775.5" y="714.8" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0..1</text><text class="tv-end" data-for="rel:base-despesas::DespesaDeExercicioVigente-&gt;base-despesas-restos-a-pagar::CriacaoDeDespesaNaoPaga:termination:" x="711.3" y="715.5" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">{addOnly}</text><g class="tv-lock" data-for="rel:base-despesas::DespesaDeExercic