<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -42 318 293" width="318" height="293">
<style>
/* Everything that is text, before anything specialises it. The label layer sits
   above the boxes and outside every other group, so a rule that reached labels
   through their edge stopped reaching them the day they were lifted out of it --
   and an SVG with no font-family on a text element falls back to a 16px serif.
   Stated once at the top, no layer can lose it again. */
text {
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-stretch: normal;
    font-size: 11px;
    fill: #e8e6e1;
    font-variant-numeric: tabular-nums;
}

.tv-node rect { stroke: #c9c4bb; stroke-width: 1; }
.tv-node text { fill: #1f1c17; }
.tv-name { font-weight: 600; font-size: 13px; letter-spacing: 0.005em; }
.tv-legend text { font-size: 13px; fill: #e8e6e1; }
.tv-stereotype { font-size: 11px; fill-opacity: 0.72; letter-spacing: 0.01em; }
.tv-attribute { font-size: 12px; }
.tv-edge path { fill: none; stroke: #c9c4bb; stroke-width: 1.2; }
.tv-end { fill: #a29c91; }
.tv-edge-stereotype { font-size: 9.5px; fill-opacity: 0.78; letter-spacing: 0.01em; }
.tv-marker { fill: #252526; stroke: #c9c4bb; stroke-width: 1.2; }
.tv-arrow { fill: none; stroke: #c9c4bb; stroke-width: 1.2; }
.tv-reading { fill: #e8e6e1; stroke: none; }
.tv-lock { fill: none; stroke: #a29c91; stroke-width: 1.1; stroke-linecap: round; }
.tv-lock rect { fill: #1e1e1e; }
.tv-group rect { fill: none; stroke: #a29c91; stroke-dasharray: 4 3; }
.tv-group text { font-size: 11px; fill: #a29c91; }
.tv-ontology rect { fill: none; stroke: #c9c4bb; stroke-width: 1.2; stroke-dasharray: none; }
.tv-ontology text { font-weight: 600; font-size: 13px; fill: #e8e6e1; }
.tv-location { font-size: 12px; fill-opacity: 0.72; }
.tv-selected rect { stroke: #6fd0c4; stroke-width: 2.5; }
/* The second selector is for a leg of a shared tree, which carries its own id
   and so is chosen as itself rather than through a group around it. */
.tv-selected path, path.tv-selected { stroke: #6fd0c4; stroke-width: 2.2; }
.tv-unresolved rect { stroke-dasharray: 5 3; }
.tv-external rect { stroke-dasharray: 2 2; }
</style>
<rect x="-22" y="-42" width="318" height="293" fill="#1e1e1e"/>
